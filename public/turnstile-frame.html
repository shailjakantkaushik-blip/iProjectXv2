<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cloudflare check</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
    </style>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </head>
  <body>
    <div id="widget"></div>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var key = params.get("k") || "";
        var lastToken = "";
        var acked = false;
        var retryTimer = 0;
        var STORAGE_KEY = "iprojectx.turnstile.token";
        var INPUT_ID = "turnstile-token-bridge";
        var EVENT_NAME = "iprojectx-turnstile-token";

        function writeParent(token) {
          try {
            var input = parent.document.getElementById(INPUT_ID);
            if (input) input.value = token || "";
          } catch (e) {}
          try {
            if (token) parent.sessionStorage.setItem(STORAGE_KEY, token);
            else parent.sessionStorage.removeItem(STORAGE_KEY);
          } catch (e) {}
          try {
            if (token) parent.localStorage.setItem(STORAGE_KEY, token);
            else parent.localStorage.removeItem(STORAGE_KEY);
          } catch (e) {}
          try {
            parent.dispatchEvent(new CustomEvent(EVENT_NAME, { detail: token || "" }));
          } catch (e) {}
        }

        function notify(token) {
          lastToken = token || "";
          writeParent(lastToken);
          try {
            parent.postMessage(
              { source: "iprojectx-turnstile", token: lastToken },
              "*",
            );
          } catch (e) {}
        }

        function stopRetry() {
          if (retryTimer) {
            clearInterval(retryTimer);
            retryTimer = 0;
          }
        }

        function startRetry() {
          stopRetry();
          if (!lastToken) return;
          var n = 0;
          retryTimer = setInterval(function () {
            n += 1;
            if (!lastToken) {
              stopRetry();
              return;
            }
            writeParent(lastToken);
            if (acked && n > 8) {
              stopRetry();
              return;
            }
            try {
              parent.postMessage(
                { source: "iprojectx-turnstile", token: lastToken },
                "*",
              );
            } catch (e) {}
            if (n > 40) stopRetry();
          }, 250);
        }

        function readWidgetToken() {
          var value = "";
          try {
            if (window.turnstile && typeof window.turnstile.getResponse === "function") {
              value = window.turnstile.getResponse() || "";
            }
          } catch (e) {}
          if (!value) {
            var field = document.querySelector('[name="cf-turnstile-response"]');
            value = field && field.value ? field.value : "";
          }
          return value || "";
        }

        window.iprojectxLastTurnstileToken = function () {
          return lastToken || readWidgetToken();
        };

        window.iprojectxTurnstileOk = function (token) {
          acked = false;
          notify(token);
          startRetry();
        };
        window.iprojectxTurnstileExpire = function () {
          if (!lastToken && !readWidgetToken()) {
            acked = false;
            stopRetry();
            notify("");
          }
        };

        window.addEventListener("message", function (event) {
          var data = event.data;
          if (typeof data === "string") {
            try {
              data = JSON.parse(data);
            } catch (e) {
              return;
            }
          }
          if (!data || data.source !== "iprojectx-turnstile") return;
          if (data.type === "ack") {
            acked = true;
            return;
          }
          if (data.type === "ready") {
            if (lastToken) notify(lastToken);
          }
        });

        setInterval(function () {
          var value = readWidgetToken();
          if (value && value !== lastToken) {
            acked = false;
            notify(value);
            startRetry();
          } else if (lastToken) {
            writeParent(lastToken);
          }
        }, 400);

        var el = document.getElementById("widget");
        el.className = "cf-turnstile";
        el.setAttribute("data-sitekey", key);
        el.setAttribute("data-size", "normal");
        el.setAttribute("data-theme", "auto");
        el.setAttribute("data-appearance", "always");
        el.setAttribute("data-response-field", "true");
        el.setAttribute("data-response-field-name", "cf-turnstile-response");
        el.setAttribute("data-callback", "iprojectxTurnstileOk");
        el.setAttribute("data-expired-callback", "iprojectxTurnstileExpire");
      })();
    </script>
  </body>
</html>
